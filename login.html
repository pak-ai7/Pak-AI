<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In - Pak AI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* --- Base Reset --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --navy: #0A1B3F; --teal: #1DB5A5; --bg-white: #FFFFFF;
            --bg-light: #F8FAFC; --text-dark: #0F172A; --text-gray: #475569; --border-color: #E2E8F0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Background Glow Effect */
        .bg-glow-1 {
            position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(29,181,165,0.15) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; z-index: -1;
        }
        .bg-glow-2 {
            position: absolute; bottom: -10%; right: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(10,27,63,0.08) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%; z-index: -1;
        }

        /* Auth Card Container */
        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            z-index: 10;
        }

        .auth-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(10, 27, 63, 0.08), 0 0 0 1px rgba(0,0,0,0.03);
            padding: 40px;
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo & Headers */
        .auth-logo { margin-bottom: 24px; display: flex; justify-content: center; }
        .auth-logo img { height: 45px; object-fit: contain; }
        
        .auth-card h2 { font-size: 1.6rem; font-weight: 800; color: var(--navy); margin-bottom: 8px; }
        .auth-card p { font-size: 0.95rem; color: var(--text-gray); margin-bottom: 30px; }

        /* Social Buttons */
        .btn-social {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            width: 100%; padding: 12px; background: white; border: 1px solid var(--border-color);
            border-radius: 10px; font-size: 0.95rem; font-weight: 600; color: var(--navy);
            cursor: pointer; transition: 0.2s; margin-bottom: 12px;
        }
        .btn-social:hover { background: var(--bg-light); border-color: #CBD5E1; }

        /* Divider */
        .divider {
            display: flex; align-items: center; text-align: center; margin: 24px 0;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid var(--border-color);
        }
        .divider span {
            padding: 0 10px; color: #94A3B8; font-size: 0.85rem; font-weight: 500;
        }

        /* Form Inputs */
        .input-group { text-align: left; margin-bottom: 16px; }
        .input-group label {
            display: block; font-size: 0.85rem; font-weight: 600; color: var(--navy); margin-bottom: 6px;
        }
        .input-group input {
            width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif; font-size: 0.95rem; color: var(--text-dark);
            transition: all 0.2s; background: var(--bg-light); outline: none;
        }
        .input-group input:focus {
            border-color: var(--teal); background: white;
            box-shadow: 0 0 0 4px rgba(29, 181, 165, 0.15);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: linear-gradient(135deg, var(--navy), #122b5e); color: white;
            font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s;
            margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 8px 20px rgba(10, 27, 63, 0.2);
        }
        .btn-submit:hover {
            background: linear-gradient(135deg, #061129, var(--navy));
            transform: translateY(-2px); box-shadow: 0 10px 25px rgba(10, 27, 63, 0.3);
        }

        /* Footer Links */
        .auth-footer { margin-top: 24px; font-size: 0.9rem; color: var(--text-gray); }
        .auth-footer a { color: var(--teal); font-weight: 600; text-decoration: none; }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Background Glows -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="auth-container">
        <div class="auth-card">
            
            <div class="auth-logo">
                <img src="logo.png" alt="Pak AI">
            </div>
            
            <h2>Create an Account</h2>
            <p>Join Pak AI to start your intelligent journey.</p>

            <!-- Social Login -->
            <button class="btn-social">
                <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                Continue with Google
            </button>

            <div class="divider">
                <span>or continue with email</span>
            </div>

            <!-- Form -->
            <form onsubmit="event.preventDefault(); window.location.href='chat.html';">
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="e.g. Mukesh Heerani" required>
                </div>
                
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="you@example.com" required>
                </div>
                
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a strong password" required>
                </div>

                <button type="submit" class="btn-submit">
                    Create Account
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="#">Log in</a>
            </div>

        </div>
    </div>

</body>
  </html>
